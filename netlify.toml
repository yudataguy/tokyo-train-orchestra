# Headers only — deliberately no [build] section. The build command and
# publish directory are already configured in the Netlify UI and working;
# declaring them here would override that (and would fight the Next.js build
# plugin if it is enabled). Add them here later if you want the whole config
# in git, but check the dashboard first.

# Next emits the OG card as `out/opengraph-image`, with no file extension, so
# a static host has nothing to infer the type from and falls back to
# application/octet-stream. Every social crawler requires image/* and drops
# the preview otherwise — the tags and the PNG are both fine, the card just
# never renders. This states the type explicitly.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Netlify does not 301 the built-in *.netlify.app subdomain when a custom
# domain is set as primary — that setting only redirects other *custom*
# domains, and the netlify.app URL keeps serving 200. Both hosts therefore
# served identical content. The in-HTML canonical already pointed search
# engines at the right place; this makes it a real redirect, so crawlers that
# do not parse HTML and anyone holding an old bookmark also land on the
# canonical host. Scoped to that one hostname, so the primary domain is
# untouched and cannot loop. `force` is required to win over the static file
# that would otherwise be served.
[[redirects]]
  from = "https://tokyo-train-orchestra.netlify.app/*"
  to = "https://tokyotrainmusic.japantv.app/:splat"
  status = 301
  force = true
